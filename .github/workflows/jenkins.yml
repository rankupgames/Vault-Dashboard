name: Jenkins check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

env:
  JENKINS_CI: |
    {
      "schemaVersion": 1,
      "lanes": {
        "check": {
          "status": "jenkins/Vault-Dashboard/check",
          "runner": {"os": "linux", "profile": "small-web"},
          "execution": "local-first",
          "pullRequests": "same-repository",
          "timeoutMinutes": 90,
          "command": "bash scripts/ci-check.sh",
          "cleanup": "",
          "artifacts": "main.js,manifest.json,styles.css"
        }
      }
    }

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/jenkins-submit.yml
    with:
      source-sha: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
      branch: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      check-type: check
      pr-number: ${{ github.event_name == 'pull_request' && format('{0}', github.event.pull_request.number) || '' }}
    secrets:
      JENKINS_TRIGGER_USER: ${{ secrets.JENKINS_TRIGGER_USER }}
      JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
