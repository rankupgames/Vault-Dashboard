# Trigger-only caller for the repository's registered small-web check.
# Commit beside a reviewed copy of jenkins-submit.yml. It never checks out or runs source.
name: Jenkins check
on:
  push: {}
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  submit:
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/jenkins-submit.yml
    with:
      source-sha: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
      branch: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      check-type: check
      pr-number: ${{ github.event_name == 'pull_request_target' && format('{0}', github.event.pull_request.number) || '' }}
    secrets:
      JENKINS_TRIGGER_USER: ${{ secrets.JENKINS_TRIGGER_USER }}
      JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
