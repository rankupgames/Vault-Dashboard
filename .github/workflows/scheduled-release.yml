name: Weekly Release

on:
  schedule:
    - cron: "0 18 * * 5" # Every Friday at 18:00 UTC (12:00 CST)
  workflow_dispatch:

concurrency:
  group: weekly-release
  cancel-in-progress: false

permissions:
  contents: write
  statuses: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # The version comes from the manifest merged through a pull request.
      - name: Select unreleased manifest version
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release-version.py

      # Download only the artifacts from the trusted reporter's exact successful build.
      - name: Fetch Jenkins release files
        if: steps.release.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JENKINS_URL: ${{ vars.HOMELAB_JENKINS_URL }}
          JENKINS_REPORTER_ID: ${{ vars.JENKINS_REPORTER_ID }}
          JENKINS_USER: ${{ secrets.JENKINS_READER_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_READER_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: python3 scripts/fetch-release-artifacts.py

      - name: Tag and release
        if: steps.release.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git push origin "HEAD:refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --latest \
            --title="$VERSION" \
            --generate-notes \
            main.js manifest.json styles.css
